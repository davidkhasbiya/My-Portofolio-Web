<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    /* Default: Warna gelap pekat untuk Mode Terang */
    .logo-text { 
      fill: #09090b; 
      font-weight: 900; 
    }
    
    /* Otomatis: Menjadi putih bersih saat Mode Gelap */
    @media (prefers-color-scheme: dark) {
      .logo-text { 
        fill: #ffffff; 
      }
    }
  </style>
  
  <text x="16" y="23.5" class="logo-text" font-family="ui-monospace, SFMono-Regular, Fira Code, system-ui, sans-serif" font-size="23" text-anchor="middle">d<tspan fill="#4f46e5">.</tspan></text>
</svg>
